services:
  vacancy-postgres:
    image: postgres:15-alpine
    container_name: vacancy-postgres
    environment:
      POSTGRES_DB: vacancy_db
      POSTGRES_USER: vacancy_user
      POSTGRES_PASSWORD: vacancy_pass
    ports:
      - "5434:5432"        # снаружи 5434, внутри контейнера 5432
    volumes:
      - vacancy_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  vacancy-service:
    build:
      context: ..
      dockerfile: build/Dockerfile
    container_name: vacancy-service
    env_file:
      - ../.env           # .env лежит в корне vacancy-service
    environment:
      # подменяем DATABASE_URL так, чтобы сервис ходил в контейнер postgres
      DATABASE_URL: postgres://vacancy_user:vacancy_pass@vacancy-postgres:5432/vacancy_db?sslmode=disable
      SERVER_PORT: "8083"
    depends_on:
      - vacancy-postgres
    ports:
      - "8083:8083"
    restart: unless-stopped

volumes:
  vacancy_pg_data:
